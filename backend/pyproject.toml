[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dqa-backend"
version = "0.1.0"
description = "DEMIS Query Assistant backend application skeleton"
readme = "README.md"
requires-python = ">=3.11"
# Dependency version pins live here (single source of truth).
# requirements.txt is a thin install entrypoint for Docker / install scripts.
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "sqlalchemy>=2.0.36,<3.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "python-dotenv>=1.0.1,<2.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "sqlglot>=26.0.0,<27.0.0",
  "httpx>=0.27.0,<1.0.0",
  "alembic>=1.14.0,<2.0.0",
  "pgvector>=0.3.6,<1.0.0",
  # PyPI distribution name is ``oracledb`` (python-oracledb thin mode; no Instant Client).
  "oracledb>=2.0.0,<27.0.0",
  # Official MCP Python SDK (v1.x maintained line; Streamable HTTP transport).
  "mcp>=1.9.0,<2.0.0",
  # Authenticated encryption for MCP execution tokens (AES-GCM).
  "cryptography>=42.0.0,<51.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app" = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "integration: tests that require external services (e.g. PostgreSQL)",
]
