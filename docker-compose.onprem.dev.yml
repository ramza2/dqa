# Optional development / LAN-integration overlay for the on-prem stack.
#
# NEVER use this overlay for production.
# This is the ONLY supported way to enable development auth against the on-prem stack.
# Production Compose hardcodes APP_ENV=production + DQA_AUTH_PROVIDER=disabled;
# .env.onprem cannot override those values.
#
# This overlay sets:
#   backend:
#     APP_ENV=development
#     DQA_AUTH_PROVIDER=dev_headers
#   frontend:
#     Vite DEV server (Dockerfile.dev) instead of production nginx SPA
#     VITE_DEV_PROXY_TARGET=http://backend:8000
#     VITE_DQA_DEV_ACTOR / VITE_DQA_DEV_ROLES for browser X-DQA-Dev-* headers
#
# Host publish is inherited from docker-compose.onprem.yml:
#   ${DQA_LAN_BIND_IP}:${DQA_FRONTEND_PORT}:80
# so existing LAN URLs (e.g. http://192.168.10.104:18080) stay unchanged.
#
# Usage:
#   docker compose -f docker-compose.onprem.yml -f docker-compose.onprem.dev.yml \
#     --env-file .env.onprem up -d --build
#
# Notes:
# - Production SPA builds never inject VITE_DQA_DEV_* headers.
# - This overlay is LAN development / integration testing only.
# - Do not put real actor/role values into production Compose or .env.onprem.

services:
  backend:
    environment:
      APP_ENV: development
      DQA_AUTH_PROVIDER: dev_headers
      LLM_PARAMETER_EXTRACTION_ALLOW_RAW_REQUEST: ${LLM_PARAMETER_EXTRACTION_ALLOW_RAW_REQUEST:-false}
      LLM_PARAMETER_EXTRACTION_RAW_REQUEST_EGRESS_APPROVED: ${LLM_PARAMETER_EXTRACTION_RAW_REQUEST_EGRESS_APPROVED:-false}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_DEV_PROXY_TARGET: http://backend:8000
      VITE_DQA_DEV_ACTOR: dqa-dev-operator
      VITE_DQA_DEV_ROLES: query_operator
    # Vite DEV healthcheck (node:22-alpine has no wget; use built-in fetch).
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
