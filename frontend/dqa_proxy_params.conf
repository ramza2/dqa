# Shared reverse-proxy parameters for DQA backend locations.
# Keep only required forwarded headers. Do not inject X-DQA-Dev-* identity headers.
# Do not enable proxy_cache.
# Backend SQL/query timeouts remain authoritative; these are outer bounds only.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Preserve backend Cache-Control (do not override).
# Response caching of proxied API traffic is intentionally disabled.
proxy_pass_header Cache-Control;

proxy_connect_timeout 10s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;
