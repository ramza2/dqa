# DQA frontend SPA + same-origin /api reverse proxy.
# Auth remains fail-closed at the backend (production: DQA_AUTH_PROVIDER=disabled).
# Do not inject X-DQA-Dev-* headers here.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    autoindex off;
    server_tokens off;

    # Outer request/header timeouts (conservative internal-tool values).
    client_header_timeout 30s;
    client_body_timeout 60s;
    send_timeout 60s;

    # Default body limit for this vhost; Catalog package locations override.
    client_max_body_size 2m;

    # Security headers for SPA responses.
    # HSTS is intentionally omitted until an approved TLS termination owns HTTPS.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Catalog package upload/import: room for 50 MiB archive + multipart overhead.
    # Backend still enforces max_archive_bytes = 50 MiB.
    location = /api/v1/catalog/packages/validate {
        client_max_body_size 55m;
        include /etc/nginx/dqa_proxy_params.conf;
        proxy_pass http://backend:8000;
    }

    location = /api/v1/catalog/packages/import {
        client_max_body_size 55m;
        include /etc/nginx/dqa_proxy_params.conf;
        proxy_pass http://backend:8000;
    }

    # General API proxy — conservative body limit.
    location /api/ {
        client_max_body_size 2m;
        include /etc/nginx/dqa_proxy_params.conf;
        proxy_pass http://backend:8000;
    }

    # Optional operator convenience: probe backend through the LAN entrypoint.
    location /health {
        client_max_body_size 1m;
        include /etc/nginx/dqa_proxy_params.conf;
        proxy_pass http://backend:8000;
    }

    # Hashed Vite assets — immutable long cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-XSS-Protection "0" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-XSS-Protection "0" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
