# Minimal nginx.conf for the DQA frontend production image.
# Attack-surface reduction only; not an authentication mechanism.
# TLS/HSTS belong at the approved TLS termination point (not this container).

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide nginx version from responses / error pages.
    server_tokens off;

    sendfile on;
    keepalive_timeout 65;

    # Conservative global request/header timeouts (internal tool).
    # Backend SQL/query timeouts remain authoritative for execution.
    client_header_timeout 30s;
    client_body_timeout 60s;
    send_timeout 60s;

    # Default body limit; Catalog upload locations raise this selectively.
    client_max_body_size 2m;

    # Do not enable response caching of API or auth-sensitive content.

    include /etc/nginx/conf.d/*.conf;
}
