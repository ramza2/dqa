# Development Compose skeleton for DQA backend + PostgreSQL.
#
# Internal/LAN development is the default deployment model.
# No DNS or Traefik is required.
#
# Usage (from repository root):
#   docker compose -f docker-compose.dev.yml up --build
#
# By default the backend is host-only (127.0.0.1).
# For GPU-server LAN testing set DQA_LAN_BIND_IP to the GPU server's internal IPv4.
# PostgreSQL remains loopback-only by default.
#
# For full-stack local UI work, run the Vite frontend separately
# (`cd frontend && npm run dev`) and proxy /api to this backend.
# Production/on-prem Compose (docker-compose.onprem.yml) publishes only the
# frontend to the configured LAN bind and keeps backend + DB internal.

services:
  dqa-db:
    # pgvector-enabled PostgreSQL 16 (required for Data Discovery semantic search).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DQA_DB_NAME:-dqa}
      POSTGRES_USER: ${DQA_DB_USER:-dqa}
      POSTGRES_PASSWORD: ${DQA_DB_PASSWORD:-dqa}
    ports:
      - "${DQA_DB_BIND_IP:-127.0.0.1}:${DQA_DB_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - dqa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DQA_DB_USER:-dqa} -d ${DQA_DB_NAME:-dqa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-DEMIS Query Assistant}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DQA_DB_HOST: dqa-db
      DQA_DB_PORT: 5432
      DQA_DB_NAME: ${DQA_DB_NAME:-dqa}
      DQA_DB_USER: ${DQA_DB_USER:-dqa}
      DQA_DB_PASSWORD: ${DQA_DB_PASSWORD:-dqa}
      # Optional OpenAI-compatible Embedding provider (Data Discovery semantic/hybrid).
      # Leave blank when unused. Do not hardcode site endpoints or keys in Compose.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_NORMALIZE: ${EMBEDDING_NORMALIZE:-true}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-60}
      EMBEDDING_CONNECT_TIMEOUT_SECONDS: ${EMBEDDING_CONNECT_TIMEOUT_SECONDS:-10}
      EMBEDDING_QUERY_PREFIX: ${EMBEDDING_QUERY_PREFIX:-}
      EMBEDDING_DOCUMENT_PREFIX: ${EMBEDDING_DOCUMENT_PREFIX:-}
      DATA_DISCOVERY_SEARCH_RRF_K: ${DATA_DISCOVERY_SEARCH_RRF_K:-60}
      DATA_DISCOVERY_SEARCH_CANDIDATE_MULTIPLIER: ${DATA_DISCOVERY_SEARCH_CANDIDATE_MULTIPLIER:-3}
      DATA_DISCOVERY_SEARCH_CANDIDATE_MIN: ${DATA_DISCOVERY_SEARCH_CANDIDATE_MIN:-20}
    ports:
      - "${DQA_LAN_BIND_IP:-127.0.0.1}:${DQA_BACKEND_PORT:-8000}:8000"
    depends_on:
      dqa-db:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    volumes:
      - ./backend/app:/app/app

volumes:
  dqa_pgdata:
