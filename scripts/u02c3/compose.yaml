# U-02-C-3 synthetic-only, isolated PostgreSQL. Never expose ports.
services:
  catalog-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: u02b2b_catalog
      POSTGRES_USER: u02b2b_user
      POSTGRES_PASSWORD: u02b2b_fixture_only_never_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${DQA_U02_LEGACY_ROOT:?pinned checkout required}/database/schema_catalog/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U u02b2b_user -d u02b2b_catalog"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [isolated]

  seed:
    build:
      context: ../u02b2b
      dockerfile: Dockerfile
    depends_on:
      catalog-db:
        condition: service_healthy
    environment: &legacy_fixture_env
      PYTHONPATH: /legacy/backend
      CATALOG_DB_HOST: catalog-db
      CATALOG_DB_PORT: "5432"
      CATALOG_DB_NAME: u02b2b_catalog
      CATALOG_DB_USER: u02b2b_user
      CATALOG_DB_PASSWORD: u02b2b_fixture_only_never_prod
      MEDICAL_DB_HOST: non-existent-test-medical-host
      MEDICAL_DB_REQUIRED: "false"
      EMBEDDING_PROVIDER: fake
    volumes:
      - ${DQA_U02_LEGACY_ROOT:?pinned checkout required}/backend:/legacy/backend:ro
      - ${DQA_U02_DQA_ROOT:?DQA worktree required}/backend/tests/u02c2_inventory_core.py:/inventory_core.py:ro
      - ${DQA_U02_DQA_ROOT:?DQA worktree required}/backend/tests/u02c2_legacy_pg_inventory_runner.py:/legacy_seed.py:ro
      - ${DQA_U02_DQA_ROOT:?DQA worktree required}/backend/tests/u02c3_legacy_seed.py:/runner.py:ro
      - ${DQA_U02_ARTIFACT_DIR:?synthetic evidence required}:/output
    read_only: true
    tmpfs: [/tmp]
    command: ["python", "-B", "/runner.py"]
    networks: [isolated]

  verify:
    build:
      context: ../u02b2b
      dockerfile: Dockerfile
    depends_on:
      catalog-db:
        condition: service_healthy
    environment:
      <<: *legacy_fixture_env
      CATALOG_DB_USER: u02c2_reader
      CATALOG_DB_PASSWORD: synthetic_readonly_fixture_not_prod
    volumes:
      - ${DQA_U02_LEGACY_ROOT:?pinned checkout required}/backend:/legacy/backend:ro
      - ${DQA_U02_DQA_ROOT:?DQA worktree required}/backend/tests/u02c2_inventory_core.py:/inventory_core.py:ro
      - ${DQA_U02_DQA_ROOT:?DQA worktree required}/backend/tests/u02c2_legacy_pg_inventory_runner.py:/fixture.py:ro
      - ${DQA_U02_DQA_ROOT:?DQA worktree required}/backend/tests/u02c3_restore_verify.py:/runner.py:ro
      - ${DQA_U02_ARTIFACT_DIR:?synthetic evidence required}:/output
    read_only: true
    tmpfs: [/tmp]
    command: ["python", "-B", "/runner.py"]
    networks: [isolated]

networks:
  isolated:
    internal: true
volumes:
  pgdata:
