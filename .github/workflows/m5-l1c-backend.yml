name: M5 L1C stateless candidate review API

on:
  pull_request:
    paths:
      - 'backend/app/api/routes/integration_settings.py'
      - 'backend/app/core/config.py'
      - 'backend/tests/conftest.py'
      - 'backend/tests/test_m5_llm_candidate_review_api.py'
      - 'backend/tests/test_m5_integration_status.py'
      - 'backend/app/services/llm_connection_candidate.py'
      - 'backend/tests/test_m5_llm_connection_candidate.py'
      - 'docker-compose.onprem.dev.yml'
      - '.env.onprem.example'
      - '.github/workflows/m5-l1c-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stateless-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend testing requirements
        working-directory: backend
        run: python -m pip install -e '.[dev]'
      - name: Compile new modules
        working-directory: backend
        run: python -m compileall -q app/api/routes/integration_settings.py app/core/config.py
      - name: Stateless candidate review and existing integration regressions
        working-directory: backend
        env:
          APP_ENV: test
        run: >
          python -m pytest -q
          tests/test_m5_llm_candidate_review_api.py
          tests/test_m5_llm_connection_candidate.py
          tests/test_m5_llm_connection_probe.py
          tests/test_m5_integration_status.py
