name: DQA M5-L1A Frontend

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/m5-l1a-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Targeted component tests
        run: npx vitest run src/test/LLMConnectionDraftPanel.test.tsx src/test/IntegrationSettingsPortal.test.tsx
      - name: Production build
        run: npm run build
      - name: Lint
        run: npm run lint
