# S-06-A only: disposable PostgreSQL/pgvector for synthetic Gold Search.
# NEVER include this in an existing DQA Compose stack.
services:
  disposable-pg:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: dqa_s06a_disposable
      POSTGRES_USER: dqa_s06a_user
      POSTGRES_PASSWORD: dqa_s06a_test_only
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:55442:5432"
    tmpfs:
      - /var/lib/postgresql/data:rw,nosuid,nodev,size=512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dqa_s06a_user -d dqa_s06a_disposable"]
      interval: 2s
      timeout: 3s
      retries: 40
